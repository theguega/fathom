[package]
name         = "fathom"
description  = "A low-level, zero-overhead visualization library for multimodal spatiotemporal data."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
readme       = "README.md"
keywords     = ["visualization", "robotics", "pointcloud", "debugging"]
categories   = ["graphics", "visualization", "science::robotics"]

[dependencies]
fathom-core   = { workspace = true }
fathom-geom   = { workspace = true }
fathom-render = { workspace = true }

[dev-dependencies]
winit = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
