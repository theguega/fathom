[package]
name = "fathom-geom"
description = "Pure camera geometry and colormaps for fathom: pinhole projection, homography, scalar-to-color ramps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["visualization", "camera", "homography", "colormap"]
categories = ["graphics", "science::robotics"]

[lib]
# Only the criterion targets are benchmarks; without this cargo also runs the
# lib test harness as one, and it rejects criterion's flags.
bench = false

[dependencies]
fathom-core = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = [
  "cargo_bench_support",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[[bench]]
name = "geom"
harness = false
