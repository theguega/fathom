[workspace]
members = [
  "crates/fathom-core",
  "crates/fathom-geom",
  "crates/fathom-render",
  "crates/fathom-media",
  "crates/fathom",
  "crates/fathom-py",
  "crates/book-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/theguega/fathom"

[workspace.dependencies]
fathom-core = { version = "0.1.0", path = "crates/fathom-core" }
fathom-geom = { version = "0.1.0", path = "crates/fathom-geom" }
fathom-render = { version = "0.1.0", path = "crates/fathom-render" }
fathom-media = { version = "0.1.0", path = "crates/fathom-media" }

glam = { version = "0.30", features = ["bytemuck"] }
wgpu = { version = "26", default-features = false, features = [
  "wgsl",
  "metal",
  "vulkan",
  "dx12",
] }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
fn_params_excessive_bools = "deny"
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
exhaustive_enums = "warn"
alloc_instead_of_core = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
