name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rustfmt }
      # imports_granularity and group_imports are nightly-only; on stable
      # rustfmt ignores them and the check passes without having applied them.
      - run: cargo fmt --all --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - uses: taiki-e/install-action@v2
        with: { tool: taplo-cli }
      - run: taplo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned, not floating: the ui tests compare exact compiler diagnostics.
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # The headless tests want a GPU; lavapipe is the software one CI can have.
      - name: install a software Vulkan device
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc --all-features

  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true   # nightly breaks; that is information, not a gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install a software Vulkan device
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - run: cargo test --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: nightly
      # The next-generation trait solver, ahead of it becoming the default.
      - run: cargo test --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: -Znext-solver=globally

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-features

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links --cfg docsrs
      # rust-toolchain.toml pins 1.97.1 and wins over the action's choice;
      # RUSTUP_TOOLCHAIN is what actually overrides it. Without this the job
      # runs on stable and `#![feature(doc_cfg)]` is rejected.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --workspace --no-deps --all-features

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      # Every Rust code block in the book is a doctest of the book-tests crate,
      # so the guide cannot drift from the API. `mdbook test` cannot do this:
      # it has no --extern and its doctests default to edition 2015.
      - run: cargo test -p book-tests --doc
      - run: mdbook build book

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: Swatinem/rust-cache@v2
      - name: install a software Vulkan device
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - run: pip install maturin numpy pytest
      # `maturin develop` installs into a virtualenv and refuses without one.
      - run: python -m venv .venv
      - run: .venv/bin/pip install numpy pytest
      - run: .venv/bin/maturin develop --release -m crates/fathom-py/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/python -m pytest crates/fathom-py/tests -v
      # The stubs are checked in, so a signature change that does not reach them
      # is a diff, not a surprise for editors and mypy downstream.
      - run: .venv/bin/pip install mypy && .venv/bin/mypy --strict crates/fathom-py/fathom.pyi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # No `semver` job yet: cargo-semver-checks compares against the released
  # version on crates.io, and there is not one. It goes in with the first
  # publish, where it matters most - fathom-core is what every adapter pins.

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace -- --save-baseline pr
