name: docs
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs -Z unstable-options --generate-link-to-definition
      # rust-toolchain.toml pins 1.97.1 and wins over the action's choice, so
      # without this the nightly-only rustdoc flags above are rejected.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }

      - name: build the book
        run: mdbook build book --dest-dir ../site

      - name: build the api docs
        run: |
          cargo doc --workspace --no-deps --all-features
          mkdir -p site/api
          cp -r target/doc site/api/rust

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
