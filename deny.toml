[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `paste` and `ttf-parser` are unmaintained but reach us only through wgpu and
# naga. Flagging them fails the build for something no change here can fix, so
# the check is scoped to crates this workspace depends on directly.
unmaintained = "workspace"

[licenses]
version = 2
# Everything fathom and its GPU stack pull in. Anything outside this list is a
# deliberate decision, not a default.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
