avoid-breaking-exported-api = false
doc-valid-idents = ["MCAP", "LeRobot", "OpenCV", "Kalibr", "RealSense", "ROS", "PyO3", "..", "GPU", "CPU", "VRAM", "sRGB", "wgpu", "winit", "glam", "ffmpeg", "mp4"]
disallowed-methods = [
  { path = "std::vec::Vec::new", reason = "size the arena at init: use Vec::with_capacity" },
]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# `draw_*(f: &mut Frame, ...)` and `draw_*(s: &mut Scene, ...)` are the API's
# own shape, and short names are idiomatic in the maths around them.
single-char-binding-names-threshold = 8
